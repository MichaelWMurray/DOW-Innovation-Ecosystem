name: Build hierarchy visualizations
on:
  push:
    branches: [main]
    paths:
      - 'visualizations/hierarchy/**'
      - '.github/workflows/build-hierarchy.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: visualizations/hierarchy/package-lock.json
      - run: npm ci --prefix visualizations/hierarchy
      - run: npm run build --prefix visualizations/hierarchy -- --base=./
      - name: Update published hierarchy assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          build = Path('visualizations/hierarchy/dist')
          assets = Path('docs/shared/assets')
          for source in (build / 'assets').iterdir():
              shutil.copy2(source, assets / source.name)
          for view, title in [('treemap', 'Funding treemap'), ('nested-circles', 'Nested circles')]:
              html = (build / 'index.html').read_text()
              html = html.replace('<html lang="en">', '<html lang="en" data-view="' + ('treemap' if view == 'treemap' else 'circles') + '">')
              html = html.replace('./assets/', '../shared/assets/')
              html = html.replace('DoW Innovation Ecosystem · Draft', title + ' · DoW Innovation Ecosystem')
              Path('docs', view, 'index.html').write_text(html)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shared/assets docs/treemap/index.html docs/nested-circles/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build treemap and nested-circle assets"
            git push
          fi
